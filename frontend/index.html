<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Autonomous Coding Agent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Autonomous Coding Agent</h1>

        <p>
            Enter a task and let the AI generate Python code.
        </p>

        <label for="taskInput">
            What do you want me to build?
        </label>

        <input
            id="taskInput"
            type="text"
            placeholder="Create a calculator in Python"
        >

        <button id="runButton" type="button">
            Run Agent
        </button>

        <h2>Agent Output</h2>

        <pre id="result">Your generated code will appear here.</pre>

    </main>

    <script src="script.js"></script>

</body>

</html>
